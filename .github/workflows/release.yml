# Builds Frameline (video) and Stillframe (photos) for Windows and macOS.
# Push a tag like v1.1.0 to publish a release with all the downloads.
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Frameline, Stillframe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Version
        id: v
        shell: bash
        run: |
          pkg=$(echo "${{ matrix.app }}" | tr '[:upper:]' '[:lower:]')
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c "import $pkg; print($pkg.__version__)")" >> "$GITHUB_OUTPUT"
      - name: Build app
        shell: pwsh
        run: .\build.ps1 -Python python -App ${{ matrix.app }}
      - name: Smoke test
        shell: pwsh
        run: |
          $var = "${{ matrix.app }}".ToUpper() + "_SELFTEST"
          Set-Item "env:$var" "$PWD\selftest.png"
          $p = Start-Process dist\${{ matrix.app }}.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "app did not exit" }
          if (-not (Test-Path selftest.png)) { throw "no screenshot" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} installer\${{ steps.v.outputs.pkg }}.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Copy-Item dist\${{ matrix.app }}.exe dist\${{ matrix.app }}-${{ steps.v.outputs.version }}-Windows-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.app }}
          path: |
            dist/${{ matrix.app }}-Setup-*.exe
            dist/${{ matrix.app }}-*-Portable.exe
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.app }}-Setup-*.exe
            dist/${{ matrix.app }}-*-Portable.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        app: [Frameline, Stillframe]
        target:
          - { runner: macos-latest, arch: AppleSilicon }
          - { runner: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Version
        id: v
        run: |
          pkg=$(echo "${{ matrix.app }}" | tr '[:upper:]' '[:lower:]')
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c "import $pkg; print($pkg.__version__)")" >> "$GITHUB_OUTPUT"
      - name: Icon
        run: |
          python build_assets/make_icon.py
          iconutil -c icns build_assets/${{ steps.v.outputs.pkg }}.iconset -o build_assets/${{ steps.v.outputs.pkg }}.icns
      - name: Build app
        run: |
          if [ "${{ matrix.app }}" = "Stillframe" ]; then
            EXTRA="--collect-binaries pillow_heif --hidden-import pillow_heif --hidden-import send2trash --exclude-module sounddevice"
            ENTRY=run_stillframe.py
          else
            EXTRA="--collect-data sounddevice --hidden-import sounddevice --exclude-module PIL --exclude-module pillow_heif"
            ENTRY=run.py
          fi
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name ${{ matrix.app }} --icon "$PWD/build_assets/${{ steps.v.outputs.pkg }}.icns" \
            --osx-bundle-identifier com.miguelrato.${{ steps.v.outputs.pkg }} \
            --collect-binaries av $EXTRA \
            --exclude-module tkinter --exclude-module matplotlib \
            --workpath build --specpath build $ENTRY
          python build_assets/mac_plist.py dist/${{ matrix.app }}.app ${{ steps.v.outputs.version }} ${{ steps.v.outputs.pkg }}
          codesign --force --deep --sign - dist/${{ matrix.app }}.app
      - name: Smoke test
        run: |
          VAR=$(echo "${{ matrix.app }}" | tr '[:lower:]' '[:upper:]')_SELFTEST
          env "$VAR=$PWD/selftest.png" QT_QPA_PLATFORM=offscreen dist/${{ matrix.app }}.app/Contents/MacOS/${{ matrix.app }} &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          test -f selftest.png
      - name: Make DMG
        run: |
          mkdir -p dmg
          cp -R dist/${{ matrix.app }}.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ${{ matrix.app }} -srcfolder dmg -ov -format UDZO "dist/${{ matrix.app }}-${{ steps.v.outputs.version }}-macOS-${{ matrix.target.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.app }}-${{ matrix.target.arch }}
          path: dist/*.dmg
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
